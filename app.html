<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Studio</title>
<style>
:root{--bg:#f6f7f7;--surface:#fff;--ink:#1b2425;--muted:#586769;--line:#d8dede;--teal:#0f766e;--teal-ink:#fff;--soft:#e7f1f0;--warn:#8a5a00;--warn-bg:#fdf3dc;--bad:#a12626;--bad-bg:#fbe9e9;--ok:#1d6b3a;--ok-bg:#e5f3ea;--r:8px}
@media (prefers-color-scheme:dark){:root{--bg:#141919;--surface:#1c2323;--ink:#e6ecec;--muted:#9fb0b1;--line:#334041;--teal:#3fb5aa;--teal-ink:#06201e;--soft:#213231;--warn:#f0c46a;--warn-bg:#3a2f14;--bad:#f19a9a;--bad-bg:#3b1e1e;--ok:#8fd3a6;--ok-bg:#1b3324}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:17px;margin:0}h2{font-size:16px;margin:0 0 8px}h3{font-size:14px;margin:14px 0 6px}
p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:13px}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
header .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
nav button{white-space:nowrap}
main{padding:14px;max-width:1280px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--teal)}
button.primary{background:var(--teal);color:var(--teal-ink);border-color:var(--teal);font-weight:600}
button.tab[aria-current=page]{background:var(--soft);border-color:var(--teal);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
textarea{width:100%;min-height:64px}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.note{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:8px 12px;margin:8px 0}
.err{background:var(--bad-bg);color:var(--bad);border-radius:var(--r);padding:8px 12px;margin:8px 0}
.okbox{background:var(--ok-bg);color:var(--ok);border-radius:var(--r);padding:8px 12px;margin:8px 0}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:600}
.num{font-size:22px;font-weight:650}.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0}
#confirmbar{position:sticky;top:0;z-index:5}
#confirmbar .card{border-color:var(--teal);box-shadow:0 2px 10px rgba(0,0,0,.12)}
#status{font-size:12px}
.screen{display:grid;gap:12px;grid-template-columns:minmax(220px,300px) minmax(0,1fr) minmax(240px,320px)}
.queue{max-height:70vh;overflow:auto;padding:0}.queue button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 10px}
.queue button[aria-current=true]{background:var(--soft)}
.abstract{white-space:pre-wrap}
.subtabs{display:none}
@media (max-width:980px){.screen{grid-template-columns:1fr}.subtabs{display:flex;gap:4px;margin-bottom:8px}.screen>[data-pane]{display:none}.screen>[data-pane].on{display:block}}
code,pre{font:13px ui-monospace,Menlo,Consolas,monospace}pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:8px;border-radius:6px;max-height:260px;overflow:auto}
</style>
</head>
<body>
<header id="hdr"></header>
<nav id="nav" aria-label="Sections"></nav>
<div id="confirmbar"></div>
<main id="main" tabindex="-1"><p class="muted">Loading Review Studio…</p></main>
<script>
"use strict";
// Review Studio screen. One file, no dependencies. Runs (a) inside Claude as an MCP App, talking to the server through the host,
// or (b) in a normal browser tab, signed in directly. All text that comes from records or people is escaped before display.
const SB = "https://wiomuxjhozhymxeuaihx.supabase.co";
const KEY = "sb_publishable_yHEz3GmzwWjgAXUsGvl2og_OEXrYUBc"; // publishable key: public by design
const API = SB + "/functions/v1/mcp/api/call";
const VERSION = "0.1.0";
const S = { mode: null, lang: "en", me: null, rid: null, ov: null, view: "portfolio", stage: "ta", filter: "todo", queue: null, rec: null, crit: null, pane: "queue",
  pending: [], data: {}, status: "", err: null, flash: null, session: null, consent: null };
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const L = (en, pt) => (S.lang === "pt-BR" && pt ? pt : en);
const time = (v) => { try { return new Date(v).toLocaleString(S.lang, { dateStyle: "short", timeStyle: "short" }); } catch { return String(v ?? ""); } };
const has = (cap) => (S.ov?.your_capabilities ?? []).includes(cap);
const isMod = () => S.ov ? S.ov.your_role === "principal_moderator" : !!S.me?.is_principal_moderator;

/* ---------- transport ---------- */
const rpcWait = new Map(); let rpcId = 0;
function hostSend(method, params) { const id = ++rpcId; window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*"); return new Promise((res, rej) => rpcWait.set(id, { res, rej })); }
function hostNotify(method, params) { window.parent.postMessage({ jsonrpc: "2.0", method, params: params ?? {} }, "*"); }
window.addEventListener("message", (ev) => {
  const m = ev.data; if (!m || m.jsonrpc !== "2.0") return;
  if (m.id !== undefined && (m.result !== undefined || m.error !== undefined) && rpcWait.has(m.id)) {
    const w = rpcWait.get(m.id); rpcWait.delete(m.id); m.error ? w.rej(m.error) : w.res(m.result); return;
  }
  if (m.method === "ui/notifications/tool-input" && m.params?.arguments?.review_id) { S.pendingOpen = m.params.arguments.review_id; if (S.me) openReview(S.pendingOpen); }
  else if (m.method === "ui/notifications/tool-result") { const sc = m.params?.structuredContent; if (sc?.user_id) { S.me = sc; if (sc.opened_review?.review_id && !S.rid) openReview(sc.opened_review.review_id); else render(); } }
  else if (m.method === "ui/notifications/host-context-changed" && m.params?.locale) { /* language stays the person's own choice */ }
  else if ((m.method === "ui/resource-teardown" || m.method === "ping") && m.id !== undefined) window.parent.postMessage({ jsonrpc: "2.0", id: m.id, result: {} }, "*");
});
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);

function loadSession() { try { S.session = JSON.parse(localStorage.getItem("rs.session") || "null"); } catch { S.session = null; } }
function saveSession(s) { S.session = s; try { s ? localStorage.setItem("rs.session", JSON.stringify(s)) : localStorage.removeItem("rs.session"); } catch { /* storage may be unavailable */ } }
async function auth(path, body) {
  const r = await fetch(SB + "/auth/v1/" + path, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw { code: j.error_code || j.code || "auth_error", message: j.msg || j.message || j.error_description || "Sign-in failed" };
  return j;
}
function keepSession(j) { if (j.access_token) saveSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in ?? 3600) * 1000, email: j.user?.email }); }
async function token() {
  if (!S.session) throw { code: "not_authenticated", message: "Sign in first" };
  if (S.session.expires_at - Date.now() < 60000 && S.session.refresh_token) {
    try { keepSession(await auth("token?grant_type=refresh_token", { refresh_token: S.session.refresh_token })); } catch { saveSession(null); throw { code: "not_authenticated", message: "Your session ended. Sign in again." }; }
  }
  return S.session.access_token;
}

async function call(tool, args, quiet) {
  if (!quiet) setStatus("saving");
  try {
    let out;
    if (S.mode === "mcp") {
      const r = await hostSend("tools/call", { name: tool, arguments: args ?? {} });
      out = r.structuredContent ?? (r.content?.[0]?.text ? JSON.parse(r.content[0].text) : null);
      if (r.isError) throw (out?.error ?? { code: "error", message: "The request failed" });
    } else {
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + (await token()) }, body: JSON.stringify({ tool, arguments: args ?? {} }) });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) { saveSession(null); throw { code: "not_authenticated", message: "Sign in again" }; }
      if (!j.ok) throw (j.error ?? { code: "error", message: "The request failed (" + r.status + ")" });
      out = j.result;
    }
    if (!quiet) setStatus("ok");
    return out;
  } catch (e) {
    const err = e && e.message ? { code: e.code ?? "error", message: e.message } : { code: "network", message: "Could not reach Review Studio. Nothing was saved." };
    if (!quiet) setStatus("failed");
    throw err;
  }
}
function setStatus(s) { S.status = s; const el = $("#status"); if (el) el.outerHTML = statusPill(); }
const statusPill = () => S.status === "saving" ? `<span id="status" class="pill warn" role="status">${L("Working…", "Processando…")}</span>` : S.status === "failed" ? `<span id="status" class="pill bad" role="status">${L("Failed — not saved", "Falhou — não salvo")}</span>` : S.status === "ok" ? `<span id="status" class="pill ok" role="status">${L("Done", "Concluído")}</span>` : `<span id="status" class="pill" role="status">${L("Idle", "Parado")}</span>`;

/* ---------- data loading ---------- */
async function guard(fn) { S.err = null; try { await fn(); } catch (e) { S.err = e; } render(); }
async function boot() {
  loadSession();
  const q = new URLSearchParams(location.search);
  if (location.hash.includes("access_token=")) { // return from an email confirmation link
    const h = new URLSearchParams(location.hash.slice(1));
    saveSession({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_at: Date.now() + Number(h.get("expires_in") || 3600) * 1000 });
    history.replaceState(null, "", location.pathname + location.search);
  }
  if (q.get("authorization_id")) { S.mode = "web"; S.consent = { id: q.get("authorization_id") }; return S.session ? loadConsent() : render(); }
  if (window.parent !== window) {
    try {
      const r = await withTimeout(hostSend("ui/initialize", { protocolVersion: "2026-01-26", clientInfo: { name: "Review Studio", version: VERSION }, appInfo: { name: "Review Studio", version: VERSION }, appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] } }), 2500);
      S.mode = "mcp"; S.host = r; hostNotify("ui/notifications/initialized");
      new ResizeObserver(() => hostNotify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight })).observe(document.body);
    } catch { S.mode = "web"; }
  } else S.mode = "web";
  if (S.mode === "web" && !S.session) return render();
  await guard(async () => { S.me = await call("whoami", {}, true); S.lang = S.me.locale || "en"; });
  const want = S.pendingOpen || q.get("review");
  if (want && S.me) openReview(want);
}
async function openReview(rid) { S.rid = rid; S.view = "overview"; S.queue = null; S.rec = null; S.crit = null; S.data = {}; await show("overview"); }
async function refreshPending() { try { S.pending = (await call("pending_confirmations", S.rid ? { review_id: S.rid } : {}, true)).confirmations; } catch { /* shown on next action */ } }
const LOADERS = {
  portfolio: async () => { S.me = await call("whoami", {}, true); },
  overview: async () => { S.ov = await call("get_review_status", { review_id: S.rid }, true); },
  protocol: async () => { S.data.review = await call("get_review", { review_id: S.rid }, true); S.crit = await call("list_criteria", { review_id: S.rid }, true); },
  imports: async () => { S.data.sources = await call("list_sources", { review_id: S.rid }, true); },
  duplicates: async () => { S.data.dd = await call("dedup_status", { review_id: S.rid }, true); },
  screening: async () => { if (!S.crit) S.crit = await call("list_criteria", { review_id: S.rid }, true); S.queue = await call("get_queue", { review_id: S.rid, stage: S.stage, filter: S.filter, limit: 200 }, true); if (S.rec && !S.queue.items.some((i) => i.record_id === S.rec.record.record_id)) S.rec = null; },
  prisma: async () => { S.data.prisma = await call("get_prisma", { review_id: S.rid }, true); },
  team: async () => { S.data.team = await call("list_team", { review_id: S.rid }, true); },
  approvals: async () => { S.data.approvals = await call("list_approvals", { review_id: S.rid, status: "all" }, true); },
  activity: async () => { S.data.audit = await call("get_audit", { review_id: S.rid, limit: 100 }, true); },
  connections: async () => { S.me = await call("whoami", {}, true); },
};
async function show(view) {
  S.view = view; S.flash = null;
  await guard(async () => { if (S.rid && !S.ov) S.ov = await call("get_review_status", { review_id: S.rid }, true); if (LOADERS[view]) await LOADERS[view](); await refreshPending(); });
  $("#main").focus({ preventScroll: true });
}
const reload = () => show(S.view);

/* ---------- views ---------- */
const NAV = [["overview", "Overview", "Visão geral"], ["protocol", "Protocol", "Protocolo"], ["imports", "Searches and imports", "Buscas e importações"], ["duplicates", "Duplicates", "Duplicatas"],
  ["screening", "Screening", "Triagem"], ["prisma", "PRISMA tracker", "PRISMA"], ["team", "Team", "Equipe"], ["approvals", "Moderator approvals", "Aprovações"], ["activity", "Activity and export", "Atividade e exportação"],
  ["later", "Extraction · Bias · R analyses · Reporting", "Extração · Viés · R · Relatório"], ["connections", "Connections", "Conexões"]];
function renderChrome() {
  const o = S.ov;
  $("#hdr").innerHTML = `<h1>Review Studio</h1>` + (o && S.rid ? `<div class="meta"><strong style="color:var(--ink)">${esc(o.code)} · ${esc(o.title)}</strong>${o.is_synthetic ? `<span class="pill warn">SYNTHETIC TEST DATA</span>` : ""}
      <span>${L("Status", "Situação")}: ${esc(o.status)}</span><span>${L("Protocol", "Protocolo")}: ${esc(o.protocol?.label ?? "—")} (${esc(o.protocol?.status ?? "none")})</span>
      <span>${L("You", "Você")}: ${esc(o.your_role === "principal_moderator" ? L("principal moderator", "moderador principal") : L("member", "membro"))}${o.your_capabilities?.length ? " · " + esc(o.your_capabilities.join(", ")) : ""}</span>
      <span>${L("Retrieved", "Consultado")}: ${esc(time(o.retrieved_at))}</span></div>` : `<div class="meta">${S.me ? esc(S.me.email ?? "") : ""}</div>`) +
    `<div class="row" style="margin-left:auto">${statusPill()}${S.rid ? `<button data-a="reload">${L("Refresh", "Atualizar")}</button><button data-a="portfolio">${L("All reviews", "Todas as revisões")}</button>` : ""}
      ${S.mode === "mcp" ? `<button data-a="fullscreen">${L("Expand", "Expandir")}</button>` : ""}
      <button data-a="lang" aria-label="Language">${S.lang === "pt-BR" ? "English" : "Português"}</button></div>`;
  $("#nav").innerHTML = S.rid ? NAV.map(([k, en, pt]) => `<button class="tab" data-a="nav" data-v="${k}" ${S.view === k ? 'aria-current="page"' : ""}>${esc(L(en, pt))}${k === "approvals" && S.ov?.tasks?.moderator_approvals_pending ? ` <span class="pill warn">${S.ov.tasks.moderator_approvals_pending}</span>` : ""}</button>`).join("") : "";
  $("#nav").style.display = S.rid ? "flex" : "none";
  $("#confirmbar").innerHTML = S.pending.length && !(S.view === "screening" && S.voteTicket) ? `<div class="card"><h2>${L("Waiting for your confirmation", "Aguardando sua confirmação")}</h2><p class="small muted">${L("Nothing below is saved until you press Confirm. Check that it is exactly what you intend.", "Nada abaixo é salvo até você confirmar.")}</p>` +
    S.pending.map((p) => `<div class="row" style="margin:6px 0"><span style="flex:1;min-width:220px">${esc(p.summary)} <span class="pill">${L("prepared via", "preparado via")} ${esc(String(p.created_channel ?? "").startsWith("mcp") ? "Claude" : L("this screen", "esta tela"))}</span> <span class="small muted">${L("expires", "expira")} ${esc(time(p.expires_at))}</span></span>
      <button class="primary" data-a="confirm" data-id="${esc(p.confirmation_id)}" data-h="${esc(p.payload_hash)}">${L("Confirm", "Confirmar")}</button><button data-a="cancel" data-id="${esc(p.confirmation_id)}">${L("Cancel", "Cancelar")}</button></div>`).join("") + `</div>` : "";
}
const errBox = () => S.err ? `<div class="err" role="alert"><strong>${esc(S.err.message)}</strong> <span class="small">(${esc(S.err.code)})</span></div>` : "";
const flashBox = () => S.flash ? `<div class="okbox" role="status">${S.flash}</div>` : "";
const stat = (label, value, sub) => `<div class="card"><div class="small muted">${esc(label)}</div><div class="num">${esc(value ?? "—")}</div>${sub ? `<div class="small muted">${esc(sub)}</div>` : ""}</div>`;
const obj = (o) => `<dl class="kv">${Object.entries(o ?? {}).map(([k, v]) => `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${esc(typeof v === "object" && v !== null ? JSON.stringify(v) : v ?? "—")}</dd>`).join("")}</dl>`;

const V = {
  signin: () => `<div class="card" style="max-width:420px"><h2>${S.consent ? L("Sign in to continue", "Entre para continuar") : L("Sign in to Review Studio", "Entrar no Review Studio")}</h2>
    <p class="small muted">${L("Each person uses their own Review Studio account. Access to a review needs an invitation from the moderator.", "Cada pessoa usa a própria conta. O acesso a uma revisão depende de convite do moderador.")}</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" style="width:100%">
    <label for="pw">${L("Password", "Senha")}</label><input id="pw" type="password" autocomplete="current-password" style="width:100%">
    <div class="row" style="margin-top:12px"><button class="primary" data-a="signin">${L("Sign in", "Entrar")}</button><button data-a="signup">${L("Create account", "Criar conta")}</button></div></div>`,
  consent: () => { const c = S.consent?.details; if (!c) return `<p class="muted">${L("Loading the request…", "Carregando o pedido…")}</p>`;
    let host = ""; try { host = new URL(c.redirect_uri).hostname; } catch { host = ""; }
    const trusted = host === "claude.ai" || host.endsWith(".claude.ai") || host === "claude.com" || host.endsWith(".claude.com") || host === "localhost" || host === "127.0.0.1";
    return `<div class="card" style="max-width:520px"><h2>${L("Allow this app to use your Review Studio account?", "Permitir que este app use sua conta do Review Studio?")}</h2>
      ${obj({ app: c.client?.name ?? c.client?.client_name ?? "(unnamed)", returns_to: c.redirect_uri, your_account: c.user?.email, requested: c.scope || "basic access" })}
      ${trusted ? `<p>${L("If you approve, this app can act in Review Studio as you: read what you may read and prepare actions. Votes and approvals still need your confirmation on screen.", "Se aprovar, este app poderá agir como você no Review Studio. Votos e aprovações continuam exigindo sua confirmação na tela.")}</p>
      <div class="row"><button class="primary" data-a="consent" data-d="approve">${L("Allow", "Permitir")}</button><button data-a="consent" data-d="deny">${L("Deny", "Negar")}</button></div>`
      : `<div class="err">${L("This request does not return to Claude. Review Studio only approves Claude (claude.ai or Claude on your own computer). If you did not start this, deny it.", "Este pedido não retorna ao Claude. Negue se você não o iniciou.")}</div><button data-a="consent" data-d="deny">${L("Deny", "Negar")}</button>`}</div>`; },
  portfolio: () => `<h2>${L("Your reviews", "Suas revisões")}</h2>${(S.me?.reviews ?? []).length ? `<div class="grid">${S.me.reviews.map((r) => `<div class="card"><div class="small muted">${esc(r.code)} · ${esc(r.status)}${r.is_synthetic ? " · SYNTHETIC" : ""}</div><div style="font-weight:600;margin:4px 0">${esc(r.title)}</div>
      <div class="small muted">${L("Your rights", "Seus direitos")}: ${esc((r.capabilities ?? []).join(", ") || (S.me.is_principal_moderator ? L("moderator", "moderador") : "—"))}</div><div class="small"><code>${esc(r.review_id)}</code></div>
      <button class="primary" style="margin-top:8px" data-a="open" data-id="${esc(r.review_id)}">${L("Open", "Abrir")}</button></div>`).join("")}</div>`
    : `<div class="card"><p>${L("You have no reviews yet.", "Você ainda não tem revisões.")}</p><p class="small muted">${S.me?.is_principal_moderator ? L("Create one from the conversation where the protocol was approved: ask Claude to “prepare this review for screening in Review Studio using the approved protocol”.", "Crie uma a partir da conversa do protocolo aprovado.") : L("Ask the moderator for an invitation code, then enter it below.", "Peça um código de convite ao moderador.")}</p></div>`}
    ${S.me && !S.me.workspace?.moderator_set ? `<div class="note">${L("The workspace has no principal moderator yet. This is a one-time setup step done outside the app.", "O workspace ainda não tem moderador principal.")}</div>` : ""}
    <div class="card" style="max-width:520px"><h3 style="margin-top:0">${L("Accept an invitation", "Aceitar um convite")}</h3><label for="inv">${L("One-time invitation code", "Código de convite")}</label><input id="inv" style="width:100%" autocomplete="off">

function render() {
  renderChrome();
  let view = S.view;
  if (S.mode === "web" && !S.session) view = "signin";
  else if (S.consent) view = "consent";
  else if (!S.rid && view !== "connections") view = "portfolio";
  $("#main").innerHTML = errBox() + flashBox() + (V[view] ? V[view]() : "");
  if (S.voteTicket) $("#voteconfirm")?.focus();
}

const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
async function prepare(tool, args) { // propose_* → ticket shown in the confirmation bar
  await guard(async () => { const t = await call(tool, args); if (t?.status === "awaiting_human_confirmation") { await refreshPending(); S.flash = esc(L("Prepared. Review it in the box at the top and confirm.", "Preparado. Revise e confirme no topo.")); } else S.flash = esc(t?.next_step ?? t?.status ?? "Done"); });
}
async function loadConsent() {
  await guard(async () => {
    const r = await fetch(SB + "/auth/v1/oauth/authorizations/" + encodeURIComponent(S.consent.id), { headers: { apikey: KEY, Authorization: "Bearer " + (await token()) } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: j.error_code || "consent_error", message: j.msg || j.message || "This authorization request is not valid or has expired. Start again from Claude." };
    if (j.redirect_url) { location.assign(j.redirect_url); return; }
    S.consent.details = j;
  });
}

  ddpolicy: (d) => guard(async () => { const r = await call("propose_dedup_policy", { review_id: S.rid, exact_bibliographic: d.x === "1" }); await LOADERS.duplicates(); S.flash = esc(L("Policy proposed; it needs moderator approval", "Política proposta; precisa de aprovação") + ` (#${r.approval_id}).`); }),
  dryrun: () => guard(async () => { S.data.dry = await call("dedup_dry_run", { review_id: S.rid }); }),
  ddapply: (d) => guard(async () => { S.data.dry = { ...S.data.dry, ...(await call("dedup_apply", { run_id: Number(d.id) })) }; S.ov = null; await LOADERS.duplicates(); }),
  ddres: (d) => guard(async () => { await call("dedup_resolve", { queue_id: Number(d.id), action: d.x, keep_record_id: d.k ? Number(d.k) : undefined }); S.ov = null; await LOADERS.duplicates(); }),
  ddundo: (d) => guard(async () => { await call("dedup_undo", { event_id: Number(d.id) }); S.ov = null; await LOADERS.duplicates(); }),
  stage: (d) => { S.stage = d.x; S.rec = null; S.voteTicket = null; show("screening"); },
  pane: (d) => { S.pane = d.x; render(); },
  rec: (d) => guard(async () => { S.voteTicket = null; S.rec = await call("get_record", { review_id: S.rid, record_id: Number(d.id), stage: S.stage }, true); S.pane = "record"; }),
  vote: (d) => guard(async () => { const reason = val("v_reason"); if (d.x === "exclude" && S.stage === "ft" && !reason) throw { code: "primary_reason_required", message: L("Choose the primary reason for a full-text exclusion.", "Escolha o motivo principal.") };
    S.voteTicket = await call("propose_vote", { review_id: S.rid, record_id: S.rec.record.record_id, stage: S.stage, decision: d.x, primary_reason_id: d.x === "exclude" && reason ? Number(reason) : undefined, note: val("v_note") || undefined }); S.status = ""; S.pane = "decision"; }),
  votecancel: () => guard(async () => { await call("cancel_confirmation", { confirmation_id: S.voteTicket.confirmation_id }, true); S.voteTicket = null; }),
  voteconfirm: () => guard(async () => { const t = S.voteTicket; await call("confirm", { confirmation_id: t.confirmation_id, payload_hash: t.payload_hash }); S.voteTicket = null;
    const cur = S.rec.record.record_id; await LOADERS.screening(); const next = S.queue.items.find((i) => i.record_id !== cur && !i.your_decision && i.you_can_vote);
    S.rec = await call("get_record", { review_id: S.rid, record_id: (S.filter === "todo" && next ? next.record_id : cur), stage: S.stage }, true); S.pane = "record"; S.flash = esc(L("Vote saved.", "Voto salvo.")); }),
  notretrieved: () => guard(async () => { const r = await call("mark_retrieval", { review_id: S.rid, record_id: S.rec.record.record_id, not_retrieved: true, note: val("v_note") || undefined }); await LOADERS.screening(); S.rec = null; S.flash = esc(r.note); }),
  adjudicate: () => guard(async () => { const r = await call("recommend_adjudication", { review_id: S.rid, record_id: S.rec.record.record_id, stage: S.stage, resolution: val("adj_res"), primary_reason_id: val("adj_reason") ? Number(val("adj_reason")) : undefined, rationale: val("adj_rat") || undefined }); S.flash = esc(L("Recommendation sent to moderator approvals", "Recomendação enviada") + ` (#${r.approval_id}).`); }),
  invite: () => prepare("propose_invitation", { review_id: S.rid, email_hint: val("iv_email") || undefined, capabilities: [...document.querySelectorAll("[data-ivcap]:checked")].map((x) => x.value) }),
  grants: (d) => { const boxes = [...document.querySelectorAll(`[data-cap="${CSS.escape(d.id)}"]`)]; const m = S.data.team.members.find((x) => x.user_id === d.id);
    prepare("propose_grant_change", { review_id: S.rid, user_id: d.id, grant: boxes.filter((b) => b.checked && !m.capabilities.includes(b.value)).map((b) => b.value), revoke: boxes.filter((b) => !b.checked && m.capabilities.includes(b.value)).map((b) => b.value) }); },
  decide: (d) => prepare("propose_approval_decision", { approval_id: Number(d.id), decision: d.x, reason: val("ap_reason_" + d.id) || undefined }),
  export: (d) => guard(async () => { const r = await call("export", { review_id: S.rid, kind: d.x, format: d.f }); S.data.exported = r; if (S.view !== "activity") S.view = "activity", await LOADERS.activity();
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([r.text], { type: r.format === "csv" ? "text/csv" : "application/json" })); a.download = r.filename; document.body.appendChild(a); a.click(); a.remove(); } catch { /* copy box is the fallback */ } }),
};
document.addEventListener("click", (e) => { const el = e.target.closest("[data-a]"); if (el && !el.disabled && A[el.dataset.a]) { e.preventDefault(); A[el.dataset.a](el.dataset); } });
document.addEventListener("change", (e) => { if (e.target.dataset?.change === "filter") { S.filter = e.target.value; S.rec = null; show("screening"); } });
boot();
</script>
</body>
</html>

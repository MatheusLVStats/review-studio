<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Studio</title>
<style>
:root{color-scheme:light;--bg:#f4f6f8;--surface:#fff;--ink:#1a2327;--muted:#5a6a70;--line:#dde3e6;--teal:#0f6e69;--teal-ink:#fff;--soft:#e4f0ef;--rest:#d5dcdf;
--inc:#0f7a5a;--inc-bg:#e3f3ed;--may:#c78500;--may-bg:#fcf1d8;--may-ink:#6f4a00;--exc:#b5265c;--exc-bg:#fae6ed;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-variant-numeric:tabular-nums}
h1{font-size:18px;margin:0;letter-spacing:-.01em;font-weight:650}h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em;font-weight:650}h3{font-size:14px;margin:16px 0 6px;font-weight:650}
p{margin:6px 0;max-width:78ch}.muted{color:var(--muted)}.small{font-size:13px}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
header .title{flex:1;min-width:240px}header .sub{font-size:13px;color:var(--muted)}
#nav{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;overflow-x:auto}
.tabs button{border:0;background:none;padding:6px 13px;border-radius:7px;color:var(--muted);white-space:nowrap}
.tabs button[aria-current=page]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,40,50,.14)}
main{padding:18px;max-width:1240px;margin:0 auto}main:focus{outline:none}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--teal)}
button.primary{background:var(--teal);color:var(--teal-ink);border-color:var(--teal);font-weight:600}
button.wide{width:100%}button.big{padding:10px 20px;font-size:16px}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:70px}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}label.check{color:var(--ink);font-size:14px;margin:6px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tile{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile .l{color:var(--muted)}.tile .n{font-size:32px;font-weight:650;line-height:1.1}.tile button{margin-top:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--inc-bg);color:var(--inc);border-color:transparent}.pill.warn{background:var(--may-bg);color:var(--may-ink);border-color:transparent}.pill.bad{background:var(--exc-bg);color:var(--exc);border-color:transparent}
.note{background:var(--may-bg);color:var(--may-ink);border-radius:var(--r);padding:10px 14px;margin:10px 0}
.err{background:var(--exc-bg);color:var(--exc);border-radius:var(--r);padding:10px 14px;margin:10px 0}
.okbox{background:var(--inc-bg);color:var(--inc);border-radius:var(--r);padding:10px 14px;margin:10px 0}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:13px;font-weight:600}tr:last-child td{border-bottom:0}
.facts{display:grid;grid-template-columns:minmax(130px,auto) 1fr;gap:5px 18px;margin:0}.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:500}
.pretty{margin:0;padding:0;list-style:none}.pretty .pretty{margin:2px 0 6px 6px;padding-left:12px;border-left:2px solid var(--line)}.pretty li{margin:3px 0}.pretty .k{color:var(--muted)}
.next{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--soft);border:1px solid var(--teal);border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.next strong{font-size:18px;display:block;letter-spacing:-.01em}
.chart{display:flex;flex-wrap:wrap;gap:16px 26px;align-items:center}
.legend{list-style:none;margin:0;padding:0;min-width:190px;flex:1}.legend li{display:flex;justify-content:space-between;gap:16px;padding:4px 0;border-bottom:1px solid var(--line)}.legend li:last-child{border:0}.legend b{font-weight:650}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px}
.member{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.member:last-child{border:0}.member .who{font-weight:600}.member .pct{margin-left:auto;text-align:right;font-weight:650}
.bar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--rest);margin:6px 0 10px}.bar i{display:block;min-width:3px}
#confirmbar{position:sticky;top:0;z-index:5;max-width:1240px;margin:0 auto;padding:0 18px}
#confirmbar .card{border:2px solid var(--teal);margin:12px 0 0}
.screen{display:grid;gap:14px;grid-template-columns:minmax(240px,330px) minmax(0,1fr) minmax(230px,290px);align-items:start}
.queue{max-height:76vh;overflow:auto;padding:0}.queue .qhead{padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.queue button.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-left:4px solid transparent;border-radius:0;padding:10px 12px}
.queue button.item[aria-current=true]{background:var(--soft);border-left-color:var(--teal)}.queue .t{font-weight:600;display:block}
.chip{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;margin:4px 4px 0 0}
.chip.include{background:var(--inc-bg);color:var(--inc)}.chip.maybe{background:var(--may-bg);color:var(--may-ink)}.chip.exclude{background:var(--exc-bg);color:var(--exc)}.chip.plain{background:var(--bg);color:var(--muted)}
.abstract{white-space:pre-wrap;max-width:78ch}mark.mi{background:none;color:var(--inc);font-weight:650}mark.me{background:none;color:var(--exc);font-weight:650}
.actionbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.actionbar button{padding:11px 10px;font-weight:650;border-width:2px;border-color:transparent}
.d-include{background:var(--inc-bg);color:var(--inc)}.d-include:hover,.d-include.on{background:var(--inc);color:#fff}
.d-maybe{background:var(--may-bg);color:var(--may-ink)}.d-maybe:hover,.d-maybe.on{background:var(--may);color:#fff}
.d-exclude{background:var(--exc-bg);color:var(--exc)}.d-exclude:hover,.d-exclude.on{background:var(--exc);color:#fff}
.prisma{display:grid;grid-template-columns:34px minmax(210px,300px) 34px minmax(210px,300px);gap:0;align-items:center;max-width:760px}
.phase{grid-column:1;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;background:#cfe0ef;border-radius:8px;padding:8px 4px;font-size:13px;height:calc(100% - 22px);align-self:start}
.pbox{border:1.5px solid var(--ink);padding:10px 12px;text-align:center;background:var(--surface);font-size:14px;margin-bottom:22px}
.parrow{text-align:center;color:var(--ink);margin-bottom:22px}
.pdown{grid-column:2;text-align:center;line-height:1;margin:-20px 0 2px}
.phead{grid-column:2/5;background:#f6c15a;border-radius:8px;text-align:center;padding:6px;font-size:13px;margin-bottom:14px}
.empty{text-align:center;padding:38px 16px}.empty strong{display:block;font-size:18px;margin-bottom:6px}
.subtabs{display:none}
@media (max-width:1000px){.screen{grid-template-columns:1fr}.subtabs{display:flex;gap:4px;margin-bottom:8px}.screen>[data-pane]{display:none}.screen>[data-pane].on{display:block}.prisma{grid-template-columns:28px 1fr}.prisma .parrow{display:none}.prisma .side{grid-column:2}.phead{grid-column:1/3}}
details>summary{cursor:pointer;color:var(--teal);margin:8px 0}
code{font:13px ui-monospace,Menlo,Consolas,monospace}
</style>
</head>
<body>
<header id="hdr"></header>
<nav id="nav" aria-label="Sections"></nav>
<div id="confirmbar"></div>
<main id="main" tabindex="-1"><p class="muted">Loading Review Studio…</p></main>
<script>
"use strict";
// Review Studio screen. One file, no dependencies. Runs (a) inside Claude as an MCP App, talking to the server through the host,
// or (b) in a normal browser tab, signed in directly. All text that comes from records or people is escaped before display.
const SB = "https://wiomuxjhozhymxeuaihx.supabase.co";
const KEY = "sb_publishable_yHEz3GmzwWjgAXUsGvl2og_OEXrYUBc"; // publishable key: public by design
const API = SB + "/functions/v1/mcp/api/call";
const VERSION = "0.1.0";
const S = { mode: null, lang: "en", me: null, rid: null, ov: null, view: "portfolio", stage: "ta", filter: "todo", queue: null, rec: null, crit: null, pane: "queue",
  pending: [], data: {}, status: "", err: null, flash: null, session: null, consent: null };
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const L = (en, pt) => (S.lang === "pt-BR" && pt ? pt : en);
const time = (v) => { try { return new Date(v).toLocaleString(S.lang, { dateStyle: "short", timeStyle: "short" }); } catch { return String(v ?? ""); } };
const has = (cap) => (S.ov?.your_capabilities ?? []).includes(cap);
const isMod = () => S.ov ? S.ov.your_role === "principal_moderator" : !!S.me?.is_principal_moderator;

/* ---------- transport ---------- */
const rpcWait = new Map(); let rpcId = 0;
function hostSend(method, params) { const id = ++rpcId; window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*"); return new Promise((res, rej) => rpcWait.set(id, { res, rej })); }
function hostNotify(method, params) { window.parent.postMessage({ jsonrpc: "2.0", method, params: params ?? {} }, "*"); }
window.addEventListener("message", (ev) => {
  const m = ev.data; if (!m || m.jsonrpc !== "2.0") return;
  if (m.id !== undefined && (m.result !== undefined || m.error !== undefined) && rpcWait.has(m.id)) {
    const w = rpcWait.get(m.id); rpcWait.delete(m.id); m.error ? w.rej(m.error) : w.res(m.result); return;
  }
  if (m.method === "ui/notifications/tool-input" && m.params?.arguments?.review_id) { S.pendingOpen = m.params.arguments.review_id; if (S.me) openReview(S.pendingOpen); }
  else if (m.method === "ui/notifications/tool-result") { const sc = m.params?.structuredContent; if (sc?.user_id) { S.me = sc; if (sc.opened_review?.review_id && !S.rid) openReview(sc.opened_review.review_id); else render(); } }
  else if (m.method === "ui/notifications/host-context-changed" && m.params?.locale) { /* language stays the person's own choice */ }
  else if ((m.method === "ui/resource-teardown" || m.method === "ping") && m.id !== undefined) window.parent.postMessage({ jsonrpc: "2.0", id: m.id, result: {} }, "*");
});
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);

function loadSession() { try { S.kw = JSON.parse(localStorage.getItem("rs.kw") || "null"); } catch { S.kw = null; } try { S.session = JSON.parse(localStorage.getItem("rs.session") || "null"); } catch { S.session = null; } }
function saveSession(s) { S.session = s; try { s ? localStorage.setItem("rs.session", JSON.stringify(s)) : localStorage.removeItem("rs.session"); } catch { /* storage may be unavailable */ } }
async function auth(path, body) {
  const r = await fetch(SB + "/auth/v1/" + path, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw { code: j.error_code || j.code || "auth_error", message: j.msg || j.message || j.error_description || "Sign-in failed" };
  return j;
}
function keepSession(j) { if (j.access_token) saveSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in ?? 3600) * 1000, email: j.user?.email }); }
async function token() {
  if (!S.session) throw { code: "not_authenticated", message: "Sign in first" };
  if (S.session.expires_at - Date.now() < 60000 && S.session.refresh_token) {
    try { keepSession(await auth("token?grant_type=refresh_token", { refresh_token: S.session.refresh_token })); } catch { saveSession(null); throw { code: "not_authenticated", message: "Your session ended. Sign in again." }; }
  }
  return S.session.access_token;
}

async function call(tool, args, quiet) {
  if (!quiet) setStatus("saving");
  try {
    let out;
    if (S.mode === "mcp") {
      const r = await hostSend("tools/call", { name: tool, arguments: args ?? {} });
      out = r.structuredContent ?? (r.content?.[0]?.text ? JSON.parse(r.content[0].text) : null);
      if (r.isError) throw (out?.error ?? { code: "error", message: "The request failed" });
    } else {
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + (await token()) }, body: JSON.stringify({ tool, arguments: args ?? {} }) });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) { saveSession(null); throw { code: "not_authenticated", message: "Sign in again" }; }
      if (!j.ok) throw (j.error ?? { code: "error", message: "The request failed (" + r.status + ")" });
      out = j.result;
    }
    if (!quiet) setStatus("ok");
    return out;
  } catch (e) {
    const err = e && e.message ? { code: e.code ?? "error", message: e.message } : { code: "network", message: "Could not reach Review Studio. Nothing was saved." };
    if (!quiet) setStatus("failed");
    throw err;
  }
}
function setStatus(s) { S.status = s; const el = $("#status"); if (el) el.outerHTML = statusPill(); }
const statusPill = () => S.status === "saving" ? `<span id="status" class="pill warn" role="status">${L("Working…", "Processando…")}</span>` : S.status === "failed" ? `<span id="status" class="pill bad" role="status">${L("Failed — not saved", "Falhou — não salvo")}</span>` : S.status === "ok" ? `<span id="status" class="pill ok" role="status">${L("Done", "Concluído")}</span>` : `<span id="status" class="pill" role="status">${L("Idle", "Parado")}</span>`;

/* ---------- data loading ---------- */
async function guard(fn) { S.err = null; try { await fn(); } catch (e) { S.err = e; } render(); }
async function boot() {
  loadSession();
  const q = new URLSearchParams(location.search);
  if (location.hash.includes("access_token=")) { // return from an email confirmation link
    const h = new URLSearchParams(location.hash.slice(1));
    saveSession({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_at: Date.now() + Number(h.get("expires_in") || 3600) * 1000 });
    history.replaceState(null, "", location.pathname + location.search);
  }
  if (q.get("authorization_id")) { S.mode = "web"; S.consent = { id: q.get("authorization_id") }; return S.session ? loadConsent() : render(); }
  if (window.parent !== window) {
    try {
      const r = await withTimeout(hostSend("ui/initialize", { protocolVersion: "2026-01-26", clientInfo: { name: "Review Studio", version: VERSION }, appInfo: { name: "Review Studio", version: VERSION }, appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] } }), 2500);
      S.mode = "mcp"; S.host = r; hostNotify("ui/notifications/initialized");
      new ResizeObserver(() => hostNotify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight })).observe(document.body);
    } catch { S.mode = "web"; }
  } else S.mode = "web";
  if (S.mode === "web" && !S.session) return render();
  await guard(async () => { S.me = await call("whoami", {}, true); S.lang = S.me.locale || "en"; });
  const want = S.pendingOpen || q.get("review");
  if (want && S.me) openReview(want);
}
async function openReview(rid) { S.rid = rid; S.view = "overview"; S.queue = null; S.rec = null; S.crit = null; S.data = {}; await show("overview"); }
async function refreshPending() { try { S.pending = (await call("pending_confirmations", S.rid ? { review_id: S.rid } : {}, true)).confirmations; } catch { /* shown on next action */ } }
const LOADERS = {
  portfolio: async () => { S.me = await call("whoami", {}, true); },
  overview: async () => { S.ov = await call("get_review_status", { review_id: S.rid }, true); S.data.team = await call("list_team", { review_id: S.rid }, true);
    try { const e = await call("export", { review_id: S.rid, kind: "my_votes", format: "json" }, true); const m = { ta: { include: 0, maybe: 0, exclude: 0 }, ft: { include: 0, maybe: 0, exclude: 0 } };
      JSON.parse(e.text).rows.filter((r) => r.is_current).forEach((r) => { if (m[r.stage]) m[r.stage][r.decision]++; }); S.data.mine = m; } catch { S.data.mine = null; } },
  protocol: async () => { S.data.review = await call("get_review", { review_id: S.rid }, true); S.crit = await call("list_criteria", { review_id: S.rid }, true); },
  imports: async () => { S.data.sources = await call("list_sources", { review_id: S.rid }, true); },
  duplicates: async () => { S.data.dd = await call("dedup_status", { review_id: S.rid }, true); },
  screening: async () => { if (!S.crit) S.crit = await call("list_criteria", { review_id: S.rid }, true); S.queue = await call("get_queue", { review_id: S.rid, stage: S.stage, filter: S.filter, limit: 200 }, true); if (S.rec && !S.queue.items.some((i) => i.record_id === S.rec.record.record_id)) S.rec = null; if (!S.rec && S.queue.items.length) S.rec = await call("get_record", { review_id: S.rid, record_id: S.queue.items[0].record_id, stage: S.stage }, true); },
  prisma: async () => { S.data.prisma = await call("get_prisma", { review_id: S.rid }, true); },
  team: async () => { S.data.team = await call("list_team", { review_id: S.rid }, true); },
  approvals: async () => { S.data.approvals = await call("list_approvals", { review_id: S.rid, status: "all" }, true); },
  activity: async () => { S.data.audit = await call("get_audit", { review_id: S.rid, limit: 100 }, true); },
  connections: async () => { S.me = await call("whoami", {}, true); },
};
async function show(view) {
  S.view = view; S.flash = null;
  await guard(async () => { if (S.rid && !S.ov) S.ov = await call("get_review_status", { review_id: S.rid }, true); if (LOADERS[view]) await LOADERS[view](); await refreshPending(); });
  $("#main").focus({ preventScroll: true });
}
const reload = () => show(S.view);

/* ---------- views ---------- */
const H = (k) => String(k).replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase());
const fv = (v) => (v && typeof v === "object" && "h" in v) ? v.h : esc(v ?? "—");
const facts = (pairs) => `<dl class="facts">${pairs.filter(Boolean).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${fv(v)}</dd>`).join("")}</dl>`;
function pretty(v) {
  if (v === null || v === undefined || v === "") return `<span class="muted">—</span>`;
  if (v === true) return "Yes"; if (v === false) return "No";
  if (Array.isArray(v)) return !v.length ? `<span class="muted">none</span>` : v.every((x) => typeof x !== "object") ? esc(v.join(", ")) : `<ul class="pretty">${v.map((x) => `<li>${pretty(x)}</li>`).join("")}</ul>`;
  if (typeof v === "object") return `<ul class="pretty">${Object.entries(v).map(([k, x]) => `<li><span class="k">${esc(H(k))}:</span> ${pretty(x)}</li>`).join("")}</ul>`;
  return esc(v);
}
function pie(parts, size = 104) {
  const tot = parts.reduce((s, p) => s + p.n, 0);
  if (!tot) return `<svg width="${size}" height="${size}" viewBox="0 0 36 36" role="img" aria-label="No data yet"><circle cx="18" cy="18" r="16" fill="var(--rest)"/></svg>`;
  let a = 0; const pt = (t) => `${(18 + 16 * Math.sin(t)).toFixed(2)} ${(18 - 16 * Math.cos(t)).toFixed(2)}`;
  const segs = parts.filter((p) => p.n > 0).map((p) => { const f = p.n / tot, a0 = a, a1 = a + f * 2 * Math.PI; a = a1; const tip = `<title>${esc(p.label)}: ${p.n} (${Math.round(f * 100)}%)</title>`;
    return f >= 0.999 ? `<circle cx="18" cy="18" r="16" fill="${p.color}">${tip}</circle>` : `<path d="M18 18 L${pt(a0)} A16 16 0 ${f > 0.5 ? 1 : 0} 1 ${pt(a1)} Z" fill="${p.color}" stroke="var(--surface)" stroke-width="0.8">${tip}</path>`; }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 36 36" role="img" aria-label="${esc(parts.map((p) => p.label + " " + p.n).join(", "))}">${segs}</svg>`;
}
const legend = (parts) => `<ul class="legend">${parts.map((p) => `<li><span><span class="sw" style="background:${p.color}"></span>${esc(p.label)}</span><b>${esc(p.n)}</b></li>`).join("")}</ul>`;

  ddres: (d) => guard(async () => { await call("dedup_resolve", { queue_id: Number(d.id), action: d.x, keep_record_id: d.k ? Number(d.k) : undefined }); S.ov = null; await LOADERS.duplicates(); }),
  ddundo: (d) => guard(async () => { await call("dedup_undo", { event_id: Number(d.id) }); S.ov = null; await LOADERS.duplicates(); }),
  stage: (d) => { S.stage = d.x; S.rec = null; S.voteTicket = null; show("screening"); },
  pane: (d) => { S.pane = d.x; render(); },
  rec: (d) => guard(async () => { S.voteTicket = null; S.rec = await call("get_record", { review_id: S.rid, record_id: Number(d.id), stage: S.stage }, true); S.pane = "record"; }),
  vote: (d) => guard(async () => { const reason = val("v_reason"); if (d.x === "exclude" && S.stage === "ft" && !reason) throw { code: "primary_reason_required", message: L("Choose the reason for excluding first.", "Escolha primeiro o motivo da exclusão.") };
    const cur = S.rec.record.record_id; const t = await call("propose_vote", { review_id: S.rid, record_id: cur, stage: S.stage, decision: d.x, primary_reason_id: d.x === "exclude" && reason ? Number(reason) : undefined, note: val("v_note") || undefined });
    await call("confirm", { confirmation_id: t.confirmation_id, payload_hash: t.payload_hash }); S.ov = null; S.rec = null; const was = S.queue.items.findIndex((i) => i.record_id === cur); await LOADERS.screening();
    if (S.filter !== "todo") S.rec = await call("get_record", { review_id: S.rid, record_id: (S.queue.items[was + 1] ?? S.queue.items[was] ?? S.queue.items[0]).record_id, stage: S.stage }, true);
    S.pane = "record"; S.flash = esc(L("Saved", "Salvo") + ": " + t.summary); }),
  kw: () => { S.kw = { inc: val("kw_inc").split(","), exc: val("kw_exc").split(",") }; try { localStorage.setItem("rs.kw", JSON.stringify(S.kw)); } catch { /* kept for this visit only */ } render(); },
  votecancel: () => guard(async () => { await call("cancel_confirmation", { confirmation_id: S.voteTicket.confirmation_id }, true); S.voteTicket = null; }),
  voteconfirm: () => guard(async () => { const t = S.voteTicket; await call("confirm", { confirmation_id: t.confirmation_id, payload_hash: t.payload_hash }); S.voteTicket = null;
    const cur = S.rec.record.record_id; await LOADERS.screening(); const next = S.queue.items.find((i) => i.record_id !== cur && !i.your_decision && i.you_can_vote);
    S.rec = await call("get_record", { review_id: S.rid, record_id: (S.filter === "todo" && next ? next.record_id : cur), stage: S.stage }, true); S.pane = "record"; S.flash = esc(L("Vote saved.", "Voto salvo.")); }),
  notretrieved: () => guard(async () => { const r = await call("mark_retrieval", { review_id: S.rid, record_id: S.rec.record.record_id, not_retrieved: true, note: val("v_note") || undefined }); await LOADERS.screening(); S.rec = null; S.flash = esc(r.note); }),
  adjudicate: () => guard(async () => { const r = await call("recommend_adjudication", { review_id: S.rid, record_id: S.rec.record.record_id, stage: S.stage, resolution: val("adj_res"), primary_reason_id: val("adj_reason") ? Number(val("adj_reason")) : undefined, rationale: val("adj_rat") || undefined }); S.flash = esc(L("Recommendation sent to moderator approvals", "Recomendação enviada") + ` (#${r.approval_id}).`); }),
  invite: () => prepare("propose_invitation", { review_id: S.rid, email_hint: val("iv_email") || undefined, capabilities: [...document.querySelectorAll("[data-ivcap]:checked")].map((x) => x.value) }),
  grants: (d) => { const boxes = [...document.querySelectorAll(`[data-cap="${CSS.escape(d.id)}"]`)]; const m = S.data.team.members.find((x) => x.user_id === d.id);
    prepare("propose_grant_change", { review_id: S.rid, user_id: d.id, grant: boxes.filter((b) => b.checked && !m.capabilities.includes(b.value)).map((b) => b.value), revoke: boxes.filter((b) => !b.checked && m.capabilities.includes(b.value)).map((b) => b.value) }); },
  decide: (d) => prepare("propose_approval_decision", { approval_id: Number(d.id), decision: d.x, reason: val("ap_reason_" + d.id) || undefined }),
  export: (d) => guard(async () => { const r = await call("export", { review_id: S.rid, kind: d.x, format: d.f }); S.data.exported = r; if (S.view !== "activity") S.view = "activity", await LOADERS.activity();
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([r.text], { type: r.format === "csv" ? "text/csv" : "application/json" })); a.download = r.filename; document.body.appendChild(a); a.click(); a.remove(); } catch { /* copy box is the fallback */ } }),
};
document.addEventListener("click", (e) => { const el = e.target.closest("[data-a]"); if (el && !el.disabled && A[el.dataset.a]) { e.preventDefault(); A[el.dataset.a](el.dataset); } });
document.addEventListener("change", (e) => { if (e.target.dataset?.change === "filter") { S.filter = e.target.value; S.rec = null; show("screening"); } });
boot();
</script>
</body>
</html>
